services:
  segmentation:
    build: .
    image: steel-plate-segmentation:latest
    ports:
      - "8000:8000"
    # Hard memory ceiling required by the task: 256 MiB.
    mem_limit: 256m
    mem_reservation: 256m
    # Request uploads and intermediate .npy files go to /tmp on the container
    # writable layer (disk-backed), so they do not count against the 256 MiB.
    environment:
      TILE_SIZE: "512"
      TMPDIR: "/tmp"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
